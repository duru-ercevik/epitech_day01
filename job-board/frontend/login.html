<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş yap · Job Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">job<span>board</span></a>
      <nav id="nav-links" class="nav-links"></nav>
    </div>
  </header>

  <main class="container">
    <section class="card auth-card">
      <h1>Giriş yap</h1>
      <p class="muted">Hesabınla giriş yap, başvurularında bilgilerini tekrar yazma.</p>

      <form id="login-form">
        <label>E-posta <input name="email" type="email" autocomplete="email" required></label>
        <label>Şifre <input name="password" type="password" autocomplete="current-password" required></label>
        <div class="form-actions">
          <button type="submit" class="btn">Giriş yap</button>
          <p class="form-message" role="status"></p>
        </div>
      </form>

      <p class="auth-switch">Hesabın yok mu? <a href="/account.html">Hesap oluştur</a></p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
